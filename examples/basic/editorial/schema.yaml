      isRequired: true
      showInSummary: true
      height: 400

useCase:
  displayName: Use cases
  fields:
    hidden:
      type: boolean
      displayName: Hidden
      displayExtra: Hidden use cases are not linked from the Use cases front page, but accessible by URL
      showInSummary: true
    productName:
      type: string
      displayName: Produt name
      showInSummary: true
    title:
      type: string
      displayName: Title
      displayExtra: Max. 70 characters. Choose an enticing title, focus on the key features of your product.
      showInSummary: true
    createdAt:
      type: date
      displayName: Created at
      showInSummary: true
    shortDescription:
      type: string
      displayName: Short description
      displayExtra: Synthesise this project, featuring its key aspects, in one paragraph.
      showInSummary: true
    detailedDescription:
      type: markdown
      displayName: Detailed description
      displayExtra: Please provide an overview of your product, its goals and motivations and a description of the parthership.
      height: 300
    creators:
      type: markdown
      height: 200
      displayName: Creators
      displayExtra: Use only UseCaseCreator custom blocks. At least 1, 5 at most.
    creatorsText:
      type: markdown
      height: 200
      displayName: Creators text
      displayExtra: Use this section if you would like to add a few words about the consortium or the specific people that have implemented the service.
    coverImageExternal:
      type: string
      displayName: Cover image (external source)
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    coverThumbnailExternal:
      type: string
      displayName: Cover thumbnail (external source)
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    coverImageAuthorName:
      type: string
      displayName: Cover image author name
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    coverImageAuthorUrl:
      type: string
      displayName: Cover image author URL
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    coverImage:
      type: string
      displayName: Cover image (uploaded file)
      dontTranslate: true
    coverThumbnail:
      type: string
      displayName: Cover thumbnail (uploaded file)
      dontTranslate: true
    coverImageTop:
      type: number
      displayName: Cover image position
      displayExtra: 'As a percentage. 0% snaps the image to the top, 100% to the bottom.'
    country:
      type: string
      displayName: Country
      choicesPreviousValues: true
    region:
      type: string
      displayName: Region
      choicesPreviousValues: true
    market:
      type: string
      displayName: Market
      choicesPreviousValues: true
    descriptionPrimaryImage:
      type: string
      displayName: Description image (primary)
      displayExtra: Please provide a high resolution image of the service in action or any other relevant image. Minimum width is 1500px. Horizontal images are preferred.
      isUploadedFile: true
      dontTranslate: true
    descriptionPrimaryImageLegend:
      type: string
      displayName: Description image (primary) legend
    descriptionVideoUrl:
      type: string
      displayName: Description video URL
      dontTranslate: true
    descriptionVideoFile:
      type: string
      displayName: Description video file
      isUploadedFile: true
      dontTranslate: true
    descriptionVideoFallbackImage:
      type: string
      displayName: Description video fallback image (if video not available)
      isUploadedFile: true
    descriptionVideoLegend:
      type: string
      displayName: Description video (or image fallback) legend
    keyFeatures:
      type: markdown
      height: 200
      displayName: Key Features
      displayExtra: Please list 3 features of your product and provide a small description for each. The 3 features should highlight the strongest features of your service. Use only 3 UseCaseKeyFeature custom blocks.
    benefits:
      type: markdown
      height: 200
      displayName: Benefits
      displayExtra: One short paragraph and a bullet list of benefits
    benefitsImage:
      type: string
      displayName: Benefits image
      displayExtra: Square image, avoid using screenshots. Optimal size is 1000x1000px.
      dontTranslate: true
      isUploadedFile: true
    benefitsImageExternal:
      type: string
      displayName: Benefits image (external source)
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    benefitsImageAuthorName:
      type: string
      displayName: Benefits image author name
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    benefitsImageAuthorUrl:
      type: string
      displayName: Benefits image author URL
      dontTranslate: true
      displayExtra: This field is populated with Unsplash data (from Use case submission form)
    datasetIds:
      type: string
      displayName: Datasets in use
      displayExtra: IDs of datasets, comma separated
      placeholder: EO:MO:DAT:GLOBAL_ANALYSISFORECAST_PHY_001_024
      isMultiple: true
      choicesPreviousValues: true
      dontTranslate: true
    contactInfo:
      type: markdown
      height: 200
      displayName: Contact information
      displayExtra: Entered by use case author in the use case submission form. This will not be displayed in the use case page.
    comments:
      type: markdown
      height: 200
      displayName: Comments
      displayExtra: Entered by use case author in the use case submission form. This will not be displayed in the use case page.
    draftVideos:
      type: markdown
      height: 200
      displayName: Draft videos
      displayExtra: Entered by use case author in the use case submission form. This field contains a list of uploaded video files (available in Editorial) and/or external video links. These video resources may be edited to produce a video and use it as the "Description video file" (see input field above)
