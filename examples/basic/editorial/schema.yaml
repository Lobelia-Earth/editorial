      isRequired: true
      height: 300
    formTitle:
      type: string
      displayName: Form title
      isRequired: true

datasetOutage:
  displayName: Dataset outages
  fields:
    datasetId:
      type: string
      displayName: Dataset ID prefix
      displayExtra: All datasets IDs starting with this text will be matched by this outage
      isRequired: true
      dontTranslate: true
      showInSummary: true
    startTime:
      type: string
      displayName: Start time
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      isRequired: true
      dontTranslate: true
      showInSummary: true
    stopTime:
      type: string
      displayName: Stop time
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm. Leave blank for unknown stop time.'
      dontTranslate: true
      showInSummary: true
    reason:
      type: string
      displayName: Outage reason
      showInSummary: true

