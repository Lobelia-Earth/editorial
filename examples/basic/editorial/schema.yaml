event:
  displayName: Events
  fields:
    redirect:
      type: string
      displayName: Redirect url
    name:
      type: string
      displayName: Event name
      showInSummary: true
      isRequired: true
    startDate:
      type: string
      displayName: Event start date
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      showInSummary: true
      isRequired: true
    endDate:
      type: string
      displayName: Event end date
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      showInSummary: true
      isRequired: true
    location:
      type: string
      displayName: Event location
      displayExtra: 'Leave blank for online-only events'
      showInSummary: true
    isOnline:
      type: boolean
      displayName: Online
      showInSummary: true
      labelLevel: 3
    isHighlighted:
      type: boolean
      displayName: Highlighted
      showInSummary: true
      labelLevel: 2
    isHidden:
      type: boolean
      displayName: Hidden
      showInSummary: true
    image:
      type: string
      displayName: Image
      displayExtra: 'Used when sharing page in social media. Recommended aspect ratio: 2:1'
      isRequired: true
      isUploadedFile: true
    registerLink:
      type: string
      displayName: Link to registration page
      displayExtra: Only shown for future events. Opens in new tab.
    testLink:
      type: string
      displayName: Link to connection test page
      displayExtra: Only shown for future events. It is displayed in the page footer, using the variable {{testConnectionUrl}}
    introduction:
      type: string
      displayName: Event introduction
    description:
      type: markdown
      displayName: Event description
      displayExtra: You can use Image, Screenshot, Button and YoutubeEmbed custom blocks
      height: 300

