newsItem:
  displayName: News items
  fields:
    title:
      type: string
      displayName: Title
      showInSummary: true
      isRequired: true
    image:
      type: string
      displayName: Image
      displayExtra: 'Recommended aspect ratio: 20:9 (e.g. 800x360 px). Please, do not use images that contain text.'
      showInSummary: true
      dontTranslate: true
      isRequired: true
      isUploadedFile: true
    date:
      type: string
      displayName: Publication date
      displayExtra: 'Format: yyyy/mm/dd'
      showInSummary: true
      isRequired: true
      dontTranslate: true
    isHidden:
      type: boolean
      displayName: Hidden
      showInSummary: true
    standfirst:
      type: string
      displayName: Standfirst
      isRequired: true
    body:
      type: markdown
      displayName: News item body
      displayExtra: You can use Image, Screenshot, Button and YoutubeEmbed custom blocks
      height: 300

page:
  displayName: Pages
  fields:
    title:
      type: markdown
      displayName: Page title
      displayExtra: 'Example: Meet our **team**'
      showInSummary: true
      isRequired: true
    layout:
      type: markdown
      displayName: Layout
      height: 300
      allowCustomBlocks: true
      isRequired: true
    contents:
      type: markdown
      displayName: Contents
      height: 300
      allowCustomBlocks: true
      isRequired: true
    unfurlTitle:
      type: string
      displayName: Unfurl title
      displayExtra: 'Seen when sharing on Twitter, Facebook, Slack, WhatsApp…'
    unfurlDescription:
      type: string
      displayName: Unfurl description
    unfurlImage:
      type: string
      displayName: Unfurl image
      dontTranslate: true
      isUploadedFile: true

incident:
  displayName: Incidents
  fields:
    title:
      type: string
      displayName: Title
      displayExtra: Used as tab title, page title in search results (SEO) and when sharing page in social networks
      showInSummary: true
      isRequired: true
    severity:
      type: select
      displayName: Severity
      displayExtra: Minor incidents can affect some users in one service. Major incidents affect all users in one or more services.
      showInSummary: true
      isRequired: true
      choicesFixed:
        - Minor
        - Major
    startDate:
      type: string
      displayName: Start date
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      showInSummary: true
      isRequired: true
      dontTranslate: true
    endDate:
      type: string
      displayName: End date
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      showInSummary: true
      dontTranslate: true
    affectedServices:
      type: string
      isMultiple: true
      displayName: Affected services
      isRequired: true
      choicesFixed:
        - All services
        - Web portal
        - 'Data Discovery Platform (online catalogue; viewer and subsetter)'
        - Single-Sign On
        - Harmonised Data Access
        - 'Other APIs (WMS; CSW)'
        - Specific datasets
        - Jupyter Notebooks
        - Compute Platform (VM management)
        - 'Compute Platform (VM instantiation; start/stop…)'
        - Tenant management
        - WEkEO Drive
    displayInHomepage:
      type: boolean
      displayName: Display in homepage
    homepageAnnouncementStartDate:
      type: string
      displayName: Homepage announcement start date
      displayExtra: 'Assumes France local time. Format: yyyy/mm/dd hh:mm'
      showInSummary: true
      dontTranslate: true
    contents:
      type: markdown
      displayName: Contents
      isRequired: true
      height: 300

about:
  displayName: About page
  singleton: true
  fields:
    title:
      type: string
      displayName: Title
      displayExtra: Used as tab title, page title in search results (SEO) and when sharing page in social networks
