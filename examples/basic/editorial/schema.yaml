    entityLinkLabel:
      type: string
      displayName: Entity link label
      isRequired: true

aboutEntities:
  displayName: About page entities
  allowManualSorting: true
  fields:
    logo:
      type: string
      displayName: Logo
      displayExtra: In grayscale, displayed over a dark blue background
      showInSummary: false
      isRequired: true
      dontTranslate: true
      isUploadedFile: true
    description:
      type: markdown
      displayName: Description
      showInSummary: false
      isRequired: true
      height: 300
    url:
      type: string
      displayName: URL
      showInSummary: true
      isRequired: true
      dontTranslate: true

support:
  displayName: Support page
  singleton: true
  fields:
    title:
      type: string
      displayName: Title
      displayExtra: Used as tab title, page title in search results (SEO) and when sharing page in social networks
      showInSummary: true
      isRequired: true
    description:
      type: string
      displayName: Description
      displayExtra: Used as page description in search results (SEO) and when sharing page in social networks
      showInSummary: true
      isRequired: true
    heroText:
      type: string
      displayName: Hero text
      isRequired: true
    intro:
      type: string
      displayName: Page intro
      isRequired: true
    supportOpt:
      type: markdown
      displayName: Support options
